name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # Fetch the full repository contents into the runner workspace.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Remove unused toolchain directories to reclaim disk space on the runner.
      # The zig-core and rust-pipeline builds are large; extra headroom prevents
      # out-of-space failures mid-build.
      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h

      # Configure Docker Buildx as the active builder.
      # Buildx is required for dockerfile_inline support used by cpp-core and zig-core.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Detect YAML syntax errors, invalid field names, and unresolvable references
      # in docker-compose.yml before any image download or build is attempted.
      - name: Validate Compose configuration
        run: docker compose config --quiet

      # Restore BuildKit layer cache from a previous run to shorten build times.
      # The cache is keyed on the commit SHA so a cache miss triggers a full rebuild.
      - name: Restore Docker layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Build the six services that declare a Dockerfile or dockerfile_inline in
      # docker-compose.yml. All other services use pre-built registry images and
      # are therefore excluded from this step.
      #
      # Services built here:
      #   go-hub        server-go/Dockerfile
      #   python-brain  brain-python/Dockerfile
      #   rust-pipeline pipeline-rust/Dockerfile
      #   cpp-core      dockerfile_inline (gcc:14 builder + python:3.12-slim runtime)
      #   zig-core      dockerfile_inline (alpine:3.19 builder + python:3.12-slim runtime)
      #   terminal-elm  terminal-elm/Dockerfile
      - name: Build Dockerfile-based service images
        run: |
          docker compose build \
            --parallel \
            --progress plain \
            go-hub \
            python-brain \
            rust-pipeline \
            cpp-core \
            zig-core \
            terminal-elm

      # Pull the registry images for the remaining 22 application services and the
      # 3 infrastructure services (postgres, db-postgres, redis).
      # --ignore-buildable skips the six services built in the previous step.
      - name: Pull registry-based service images
        run: docker compose pull --ignore-buildable

      # Create all service containers from the resolved images without starting them.
      # A non-zero exit code here indicates that at least one image could not be
      # instantiated, which counts as a build failure.
      - name: Instantiate all service containers
        run: docker compose up --no-start

      # Count the number of containers created and assert the total is at least 28.
      # The compose project includes 26 backend services plus 2 frontend services.
      # Infrastructure services (postgres, db-postgres, redis) are counted but their
      # inclusion only increases the total above the minimum threshold.
      - name: Assert container count is at least 28
        run: |
          TOTAL=$(docker compose ps -a --quiet 2>/dev/null | grep -c .)
          echo "Containers created: ${TOTAL}"
          if [ "${TOTAL}" -lt 28 ]; then
            echo "Expected at least 28 containers, got ${TOTAL}."
            exit 1
          fi
          echo "Build verification passed: ${TOTAL} containers confirmed."

      # Remove all containers created by the previous step regardless of outcome.
      - name: Remove created containers
        if: always()
        run: docker compose down --remove-orphans
