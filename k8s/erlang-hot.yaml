apiVersion: apps/v1
kind: Deployment
metadata:
  name: erlang-hot
  labels:
    app: erlang-hot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erlang-hot
  template:
    metadata:
      labels:
        app: erlang-hot
    spec:
      containers:
      - name: erlang-hot
        image: erlang:27-alpine
        ports:
        - containerPort: 4003
---
apiVersion: v1
kind: Service
metadata:
  name: erlang-hot
  labels:
    app: erlang-hot
spec:
  selector:
    app: erlang-hot
  ports:
  - name: port-4003
    port: 4003
    targetPort: 4003
    protocol: TCP
  type: ClusterIP
