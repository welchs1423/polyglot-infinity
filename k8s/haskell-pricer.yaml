apiVersion: apps/v1
kind: Deployment
metadata:
  name: haskell-pricer
  labels:
    app: haskell-pricer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haskell-pricer
  template:
    metadata:
      labels:
        app: haskell-pricer
    spec:
      containers:
      - name: haskell-pricer
        image: debian:bookworm-slim
        imagePullPolicy: IfNotPresent
        args:
        - ./server
        ports:
        - containerPort: 8006
---
apiVersion: v1
kind: Service
metadata:
  name: haskell-pricer
  labels:
    app: haskell-pricer
spec:
  selector:
    app: haskell-pricer
  ports:
  - name: port-8006
    port: 8006
    targetPort: 8006
    protocol: TCP
  type: ClusterIP
