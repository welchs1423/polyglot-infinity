apiVersion: apps/v1
kind: Deployment
metadata:
  name: wasm-zig
  labels:
    app: wasm-zig
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wasm-zig
  template:
    metadata:
      labels:
        app: wasm-zig
    spec:
      containers:
      - name: wasm-zig
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: wasm-zig
  labels:
    app: wasm-zig
spec:
  selector:
    app: wasm-zig
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
