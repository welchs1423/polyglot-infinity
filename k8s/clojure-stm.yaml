apiVersion: apps/v1
kind: Deployment
metadata:
  name: clojure-stm
  labels:
    app: clojure-stm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clojure-stm
  template:
    metadata:
      labels:
        app: clojure-stm
    spec:
      containers:
      - name: clojure-stm
        image: clojure:temurin-21-tools-deps-alpine
        ports:
        - containerPort: 8009
---
apiVersion: v1
kind: Service
metadata:
  name: clojure-stm
  labels:
    app: clojure-stm
spec:
  selector:
    app: clojure-stm
  ports:
  - name: port-8009
    port: 8009
    targetPort: 8009
    protocol: TCP
  type: ClusterIP
