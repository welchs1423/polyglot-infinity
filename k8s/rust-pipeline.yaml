apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-pipeline
  labels:
    app: rust-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-pipeline
  template:
    metadata:
      labels:
        app: rust-pipeline
    spec:
      containers:
      - name: rust-pipeline
        image: rust-pipeline:latest
        ports:
        - containerPort: 8081
        env:
        - name: DATABASE_URL
          value: postgres://dev:polyglot@postgres/polyglot_db?sslmode=disable
        - name: REDIS_URL
          value: redis://redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: rust-pipeline
  labels:
    app: rust-pipeline
spec:
  selector:
    app: rust-pipeline
  ports:
  - name: port-8081
    port: 8081
    targetPort: 8081
    protocol: TCP
  type: ClusterIP
