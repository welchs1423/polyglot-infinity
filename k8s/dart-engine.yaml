apiVersion: apps/v1
kind: Deployment
metadata:
  name: dart-engine
  labels:
    app: dart-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dart-engine
  template:
    metadata:
      labels:
        app: dart-engine
    spec:
      containers:
      - name: dart-engine
        image: dart:stable
        ports:
        - containerPort: 9005
---
apiVersion: v1
kind: Service
metadata:
  name: dart-engine
  labels:
    app: dart-engine
spec:
  selector:
    app: dart-engine
  ports:
  - name: port-9005
    port: 9005
    targetPort: 9005
    protocol: TCP
  type: ClusterIP
