apiVersion: apps/v1
kind: Deployment
metadata:
  name: prolog-solver
  labels:
    app: prolog-solver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prolog-solver
  template:
    metadata:
      labels:
        app: prolog-solver
    spec:
      containers:
      - name: prolog-solver
        image: swipl:latest
        ports:
        - containerPort: 8011
---
apiVersion: v1
kind: Service
metadata:
  name: prolog-solver
  labels:
    app: prolog-solver
spec:
  selector:
    app: prolog-solver
  ports:
  - name: port-8011
    port: 8011
    targetPort: 8011
    protocol: TCP
  type: ClusterIP
