apiVersion: apps/v1
kind: Deployment
metadata:
  name: lua-stream
  labels:
    app: lua-stream
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lua-stream
  template:
    metadata:
      labels:
        app: lua-stream
    spec:
      containers:
      - name: lua-stream
        image: nickblah/lua:5.4-luarocks-alpine
        ports:
        - containerPort: 8007
---
apiVersion: v1
kind: Service
metadata:
  name: lua-stream
  labels:
    app: lua-stream
spec:
  selector:
    app: lua-stream
  ports:
  - name: port-8007
    port: 8007
    targetPort: 8007
    protocol: TCP
  type: ClusterIP
