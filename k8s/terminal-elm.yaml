apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminal-elm
  labels:
    app: terminal-elm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terminal-elm
  template:
    metadata:
      labels:
        app: terminal-elm
    spec:
      containers:
      - name: terminal-elm
        image: terminal-elm:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: terminal-elm
  labels:
    app: terminal-elm
spec:
  selector:
    app: terminal-elm
  ports:
  - name: port-80
    port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
