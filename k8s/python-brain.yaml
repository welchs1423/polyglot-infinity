apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-brain
  labels:
    app: python-brain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-brain
  template:
    metadata:
      labels:
        app: python-brain
    spec:
      containers:
      - name: python-brain
        image: python-brain:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: python-brain
  labels:
    app: python-brain
spec:
  selector:
    app: python-brain
  ports:
  - name: port-8000
    port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
