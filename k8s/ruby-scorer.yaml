apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruby-scorer
  labels:
    app: ruby-scorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruby-scorer
  template:
    metadata:
      labels:
        app: ruby-scorer
    spec:
      containers:
      - name: ruby-scorer
        image: ruby:3.3-slim
        ports:
        - containerPort: 9004
---
apiVersion: v1
kind: Service
metadata:
  name: ruby-scorer
  labels:
    app: ruby-scorer
spec:
  selector:
    app: ruby-scorer
  ports:
  - name: port-9004
    port: 9004
    targetPort: 9004
    protocol: TCP
  type: ClusterIP
