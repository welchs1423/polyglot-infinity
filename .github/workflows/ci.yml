name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  svelte-check:
    name: Svelte Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: portal-svelte/package-lock.json
      - run: npm ci
        working-directory: portal-svelte
      - run: npx svelte-check --threshold error
        working-directory: portal-svelte

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Go Hub
        uses: docker/build-push-action@v5
        with:
          context: ./server-go
          push: false
          load: false
      - name: Build Rust Pipeline
        uses: docker/build-push-action@v5
        with:
          context: ./pipeline-rust
          push: false
          load: false
      - name: Build Python Brain
        uses: docker/build-push-action@v5
        with:
          context: .
          file: brain-python/Dockerfile
          push: false
          load: false
