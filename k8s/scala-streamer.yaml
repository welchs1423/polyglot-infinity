apiVersion: apps/v1
kind: Deployment
metadata:
  name: scala-streamer
  labels:
    app: scala-streamer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scala-streamer
  template:
    metadata:
      labels:
        app: scala-streamer
    spec:
      containers:
      - name: scala-streamer
        image: eclipse-temurin:21-jdk-alpine
        ports:
        - containerPort: 9003
---
apiVersion: v1
kind: Service
metadata:
  name: scala-streamer
  labels:
    app: scala-streamer
spec:
  selector:
    app: scala-streamer
  ports:
  - name: port-9003
    port: 9003
    targetPort: 9003
    protocol: TCP
  type: ClusterIP
