name: Polyglot Infinity CI

on:
  push:
    branches:
      - main

env:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

jobs:

  # Job 1: Build all containers and verify the full 28-service image set is ready
  build-verify:
    name: Build and Verify 28 Containers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ubuntu-latest provides roughly 14 GB of free space.
      # Removing unused toolchains reclaims several gigabytes before pulling images.
      - name: Free up runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Abort immediately if the Compose file contains YAML or schema errors.
      - name: Validate docker-compose configuration
        run: docker compose config --quiet

      # Persist BuildKit layer cache across workflow runs to reduce rebuild time.
      - name: Restore Docker build layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Build the 6 services that declare a Dockerfile or dockerfile_inline.
      # Services: go-hub, python-brain, rust-pipeline, cpp-core, zig-core, terminal-elm
      - name: Build Dockerfile-based services in parallel
        run: |
          docker compose build \
            --parallel \
            --progress plain \
            go-hub \
            python-brain \
            rust-pipeline \
            cpp-core \
            zig-core \
            terminal-elm

      # Pull registry images for the remaining 22 application services and 2 infra services.
      # --ignore-buildable skips services that were compiled in the previous step.
      - name: Pull image-based services
        run: docker compose pull --ignore-buildable

      # Create every container without starting it.
      # docker compose will fail here if any image cannot be resolved,
      # making this step an implicit presence check for all 30 services.
      - name: Instantiate all service containers without starting
        run: docker compose up --no-start

      # Confirm that at least 28 application containers were created.
      # docker compose ps -a --quiet prints one container ID per line.
      - name: Verify container count is at least 28
        run: |
          TOTAL=$(docker compose ps -a --quiet 2>/dev/null | grep -c "." || true)
          echo "Total containers created: ${TOTAL}"
          if [ "${TOTAL}" -lt 28 ]; then
            echo "Build verification failed: expected at least 28 containers, got ${TOTAL}"
            exit 1
          fi
          echo "Build verification passed: ${TOTAL} containers confirmed."

      - name: Remove created containers
        if: always()
        run: docker compose down --remove-orphans


  # Job 2 (optional): k6 smoke load test against the three core backends
  load-test:
    name: k6 Load Test
    runs-on: ubuntu-latest
    needs: build-verify
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Reuse cached layers built in the build-verify job.
      - name: Restore Docker build layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # Pull infrastructure images and rebuild the three core application backends.
      - name: Prepare images for core services
        run: |
          docker compose pull postgres redis
          docker compose build \
            --parallel \
            --progress plain \
            go-hub \
            python-brain \
            rust-pipeline

      # Start only the services required for the smoke test to conserve runner memory.
      - name: Start core services in background
        run: docker compose up -d postgres redis go-hub python-brain rust-pipeline

      # Block until every targeted service reports readiness before issuing load.
      - name: Wait for core services to be healthy
        run: |
          echo "Waiting for postgres..."
          timeout 120 bash -c \
            "until docker compose exec -T postgres pg_isready -U dev -d polyglot_db; \
             do sleep 2; done"

          echo "Waiting for redis..."
          timeout 60 bash -c \
            "until docker compose exec -T redis redis-cli ping | grep -q PONG; \
             do sleep 2; done"

          echo "Waiting for go-hub on port 8080..."
          timeout 120 bash -c \
            "until curl -sf http://localhost:8080/health; do sleep 3; done"

          echo "Waiting for python-brain on port 8000..."
          timeout 120 bash -c \
            "until curl -sf http://localhost:8000/health; do sleep 3; done"

          echo "Waiting for rust-pipeline on port 8081..."
          timeout 120 bash -c \
            "until curl -sf http://localhost:8081/health; do sleep 3; done"

          echo "All core services are healthy."

      # Install k6 from the official Grafana APT repository.
      - name: Install k6
        run: |
          sudo gpg --batch --yes \
            --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      # Write a smoke test that round-robins across the three core health endpoints.
      # Thresholds: HTTP error rate under 5 percent, p95 latency under 2000 ms.
      - name: Write k6 smoke test script
        run: |
          mkdir -p /tmp/k6
          cat > /tmp/k6/smoke.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            vus: 10,
            duration: '30s',
            thresholds: {
              http_req_failed:   ['rate<0.05'],
              http_req_duration: ['p(95)<2000'],
            },
          };

          const ENDPOINTS = [
            'http://localhost:8080/health',
            'http://localhost:8000/health',
            'http://localhost:8081/health',
          ];

          export default function () {
            const url = ENDPOINTS[__ITER % ENDPOINTS.length];
            const res = http.get(url, { timeout: '5s' });
            check(res, {
              'status is 200': (r) => r.status === 200,
            });
            sleep(1);
          }
          EOF

      # Launch k6 in the background so container logs can be streamed in parallel.
      # The wait command then blocks until k6 exits and captures its exit code.
      - name: Run k6 load test in background and collect result
        run: |
          k6 run \
            --out json=/tmp/k6/results.json \
            /tmp/k6/smoke.js &
          K6_PID=$!
          echo "k6 started with PID ${K6_PID}"

          docker compose logs -f go-hub python-brain rust-pipeline &
          LOGS_PID=$!

          wait "${K6_PID}"
          K6_EXIT=$?

          kill "${LOGS_PID}" 2>/dev/null || true

          echo "k6 exited with code ${K6_EXIT}"
          if [ "${K6_EXIT}" -ne 0 ]; then
            echo "k6 reported threshold violations or errors."
            exit 1
          fi
          echo "k6 load test passed all thresholds."

      # Preserve the raw JSON output for offline analysis regardless of test outcome.
      - name: Upload k6 results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-run-${{ github.run_number }}
          path: /tmp/k6/results.json

      # Unconditionally remove containers and named volumes on exit.
      - name: Tear down all services
        if: always()
        run: docker compose down -v --remove-orphans
