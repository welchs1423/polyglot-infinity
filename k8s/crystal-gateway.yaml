apiVersion: apps/v1
kind: Deployment
metadata:
  name: crystal-gateway
  labels:
    app: crystal-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crystal-gateway
  template:
    metadata:
      labels:
        app: crystal-gateway
    spec:
      containers:
      - name: crystal-gateway
        image: debian:bookworm-slim
        imagePullPolicy: IfNotPresent
        args:
        - sh
        - -c
        - apt-get update -qq && apt-get install -y -qq libssl3 2>/dev/null; ./server
        ports:
        - containerPort: 9002
---
apiVersion: v1
kind: Service
metadata:
  name: crystal-gateway
  labels:
    app: crystal-gateway
spec:
  selector:
    app: crystal-gateway
  ports:
  - name: port-9002
    port: 9002
    targetPort: 9002
    protocol: TCP
  type: ClusterIP
