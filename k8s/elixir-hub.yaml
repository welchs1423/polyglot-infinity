apiVersion: apps/v1
kind: Deployment
metadata:
  name: elixir-hub
  labels:
    app: elixir-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elixir-hub
  template:
    metadata:
      labels:
        app: elixir-hub
    spec:
      containers:
      - name: elixir-hub
        image: elixir:1.18-alpine
        ports:
        - containerPort: 4000
        env:
        - name: MIX_ENV
          value: dev
        - name: REDIS_URL
          value: redis://redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: elixir-hub
  labels:
    app: elixir-hub
spec:
  selector:
    app: elixir-hub
  ports:
  - name: port-4000
    port: 4000
    targetPort: 4000
    protocol: TCP
  type: ClusterIP
