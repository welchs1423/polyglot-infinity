# Polyglot Infinity — 28-Service Polyglot Platform
# 26 language backends + 2 frontends (Svelte portal, Elm order terminal)
# Usage: docker compose up -d
# Prerequisites: Docker 24+, 16 GB RAM recommended
#
# Service port map (matches portal-svelte SERVICES registry exactly):
#   8080 go-hub           8000 python-brain    8081 rust-pipeline
#   8002 julia-engine     8003 r-stats         9001 fsharp-pricer
#   8004 ocaml-risk       9002 crystal-gateway 8005 nim-analytics
#   9003 scala-streamer   8006 haskell-pricer  9004 ruby-scorer
#   9005 dart-engine      8007 lua-stream      8008 swift-actor
#   8009 clojure-stm      8010 java-loom       8011 prolog-solver
#   4000 elixir-hub       4001 gleam-hub       4002 v-quant
#   4003 erlang-hot       9000 kotlin-scheduler
#   8012 cpp-core         8013 zig-core        8014 wasm-zig (nginx:80)
#   5173 svelte-portal    5174 terminal-elm    (nginx:80)
#
# Infrastructure (not exposed externally):
#   5432 postgres         6379 redis
#
# Network: all containers share the "polyglot" bridge network.
# Inter-service calls: http://<service-name>:<internal-port>/...

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: polyglot
      POSTGRES_DB: polyglot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d polyglot_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ polyglot ]

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ polyglot ]

  # ── Go Hub / Gateway (:8080) ────────────────────────────────────────────────
  go-hub:
    build:
      context: ./server-go
      dockerfile: Dockerfile
    ports: [ "8080:8080" ]
    environment:
      DATABASE_URL: postgres://dev:polyglot@postgres/polyglot_db?sslmode=disable
      REDIS_URL: redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [ polyglot ]

  # ── Python Brain (:8000) ────────────────────────────────────────────────────
  python-brain:
    build:
      context: .
      dockerfile: brain-python/Dockerfile
    ports: [ "8000:8000" ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [ polyglot ]

  # ── Rust Pipeline (:8081) ───────────────────────────────────────────────────
  rust-pipeline:
    build:
      context: .
      dockerfile: pipeline-rust/Dockerfile
    ports: [ "8081:8081" ]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://dev:polyglot@postgres/polyglot_db?sslmode=disable
      REDIS_URL: redis://redis:6379
    networks: [ polyglot ]

  # ── Julia Engine (:8002) ────────────────────────────────────────────────────
  julia-engine:
    image: julia:1.10-bookworm
    working_dir: /app
    command: julia server.jl
    ports: [ "8002:8002" ]
    volumes:
      - ./engine-julia:/app:ro
    networks: [ polyglot ]

  # ── R Stats (:8003) ─────────────────────────────────────────────────────────
  r-stats:
    image: r-base:4.3.3
    working_dir: /app
    command: Rscript run.R
    ports: [ "8003:8003" ]
    volumes:
      - ./engine-r:/app:ro
    networks: [ polyglot ]

  # ── F# Pricer (:9001) ───────────────────────────────────────────────────────
  fsharp-pricer:
    image: mcr.microsoft.com/dotnet/sdk:8.0-alpine
    working_dir: /app
    command: dotnet run --configuration Release
    ports: [ "9001:9001" ]
    volumes:
      - ./pricer-fsharp:/app:ro
      - fsharp_nuget:/root/.nuget
    networks: [ polyglot ]

  # ── OCaml Risk (:8004) — pre-compiled binary ────────────────────────────────
  ocaml-risk:
    image: debian:bookworm-slim
    working_dir: /app
    command: ./server
    ports: [ "8004:8004" ]
    volumes:
      - ./risk-ocaml:/app:ro
    networks: [ polyglot ]

  # ── Crystal Gateway (:9002) — pre-compiled binary ───────────────────────────
  crystal-gateway:
    image: debian:bookworm-slim
    working_dir: /app
    command: ./server
    ports: [ "9002:9002" ]
    volumes:
      - ./gateway-crystal:/app:ro
    networks: [ polyglot ]

  # ── Nim Analytics (:8005) — pre-compiled binary ─────────────────────────────
  nim-analytics:
    image: debian:bookworm-slim
    working_dir: /app
    command: ./server
    ports: [ "8005:8005" ]
    volumes:
      - ./analytics-nim:/app:ro
    networks: [ polyglot ]

  # ── Scala Streamer (:9003) ──────────────────────────────────────────────────
  scala-streamer:
    image: eclipse-temurin:21-jdk-alpine
    working_dir: /app
    command: sh run.sh
    ports: [ "9003:9003" ]
    volumes:
      - ./streamer-scala:/app:ro
      - scala_coursier:/root/.cache/coursier
    networks: [ polyglot ]

  # ── Haskell Pricer (:8006) — pre-compiled binary ────────────────────────────
  haskell-pricer:
    image: debian:bookworm-slim
    working_dir: /app
    command: ./server
    ports: [ "8006:8006" ]
    volumes:
      - ./pricer-haskell:/app:ro
    networks: [ polyglot ]

  # ── Ruby Scorer (:9004) ─────────────────────────────────────────────────────
  ruby-scorer:
    image: ruby:3.3-slim
    working_dir: /app
    command: ruby server.rb
    ports: [ "9004:9004" ]
    volumes:
      - ./scorer-ruby:/app:ro
    networks: [ polyglot ]

  # ── Dart Engine (:9005) ─────────────────────────────────────────────────────
  dart-engine:
    image: dart:stable
    working_dir: /app
    command: dart run bin/server.dart
    ports: [ "9005:9005" ]
    volumes:
      - ./engine-dart:/app:ro
      - dart_pub:/root/.pub-cache
    networks: [ polyglot ]

  # ── Gleam Hub (:4001) ───────────────────────────────────────────────────────
  gleam-hub:
    image: ghcr.io/gleam-lang/gleam:v1.2.1-erlang-alpine
    working_dir: /app
    command: gleam run
    ports: [ "4001:4001" ]
    volumes:
      - ./hub_gleam:/app:ro
    networks: [ polyglot ]

  # ── V Quant (:4002) — pre-compiled binary ───────────────────────────────────
  v-quant:
    image: debian:bookworm-slim
    working_dir: /app
    command: ./server
    ports: [ "4002:4002" ]
    volumes:
      - ./quant-v:/app:ro
    networks: [ polyglot ]

  # ── Erlang Hot (:4003) ──────────────────────────────────────────────────────
  erlang-hot:
    image: erlang:27-alpine
    working_dir: /app
    command: erl -noshell -s server start
    ports: [ "4003:4003" ]
    volumes:
      - ./hot-erlang:/app:ro
    networks: [ polyglot ]

  # ── Elixir Hub (:4000) ──────────────────────────────────────────────────────
  elixir-hub:
    image: elixir:1.18-alpine
    working_dir: /app
    command: sh -c "mix deps.get && mix run --no-halt"
    ports: [ "4000:4000" ]
    environment:
      MIX_ENV: prod
      REDIS_URL: redis://redis:6379
    volumes:
      - ./hub-elixir:/app:ro
      - elixir_mix:/root/.mix
    depends_on:
      redis: { condition: service_healthy }
    networks: [ polyglot ]

  # ── Clojure STM (:8009) ─────────────────────────────────────────────────────
  clojure-stm:
    image: clojure:temurin-21-tools-deps-alpine
    working_dir: /app
    command: clojure -M server.clj
    ports: [ "8009:8009" ]
    volumes:
      - ./ledger-clojure:/app:ro
      - clojure_m2:/root/.m2
    networks: [ polyglot ]

  # ── Java Loom (:8010) ───────────────────────────────────────────────────────
  java-loom:
    image: eclipse-temurin:21-jdk-alpine
    working_dir: /app
    command: sh run.sh
    ports: [ "8010:8010" ]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/polyglot_db
      DB_USER: dev
      DB_PASSWORD: polyglot
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./loom-java:/app
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [ polyglot ]

  # ── Prolog Solver (:8011) ───────────────────────────────────────────────────
  prolog-solver:
    image: swipl:9.2
    working_dir: /app
    command: swipl server.pl
    ports: [ "8011:8011" ]
    volumes:
      - ./solver-prolog:/app:ro
    networks: [ polyglot ]

  # ── Lua Stream (:8007) ──────────────────────────────────────────────────────
  lua-stream:
    image: nickblah/lua:5.4-luarocks-alpine
    working_dir: /app
    command: lua5.4 server.lua
    ports: [ "8007:8007" ]
    volumes:
      - ./stream-lua:/app:ro
    networks: [ polyglot ]

  # ── Swift Actor (:8008) — pre-compiled binary ───────────────────────────────
  swift-actor:
    image: debian:bookworm-slim
    working_dir: /app
    command: ./server
    ports: [ "8008:8008" ]
    volumes:
      - ./actor-swift:/app:ro
    networks: [ polyglot ]

  # ── Kotlin Scheduler (:9000) ────────────────────────────────────────────────
  kotlin-scheduler:
    image: eclipse-temurin:21-jdk-alpine
    working_dir: /app
    command: sh run.sh
    ports: [ "9000:9000" ]
    volumes:
      - ./scheduler-kotlin:/app:ro
    networks: [ polyglot ]

  # ── C++ Core (:8012) — multi-stage: compile libcore.so, serve via HTTP ──────
  # Build stage runs g++ inside gcc:14; the resulting libcore.so is copied into
  # a python:3.12-slim runtime layer that exposes it over http.server so that
  # other containers (e.g. python-brain via ctypes) can fetch the artifact.
  cpp-core:
    build:
      context: ./core-cpp
      dockerfile_inline: |
        FROM gcc:14-bookworm AS builder
        WORKDIR /build
        COPY src/calculator.cpp .
        RUN g++ -O2 -shared -fPIC -o libcore.so calculator.cpp

        FROM python:3.12-slim
        WORKDIR /app
        COPY --from=builder /build/libcore.so .
        EXPOSE 8012
        CMD ["python3", "-m", "http.server", "8012", "--directory", "/app"]
    ports: [ "8012:8012" ]
    networks: [ polyglot ]

  # ── Zig Core (:8013) — builds libzigcore.so, serves via HTTP ────────────────
  # zig build compiles src/core.zig as a dynamic library (ReleaseFast);
  # python3 http.server exposes the artifact for FFI consumers.
  zig-core:
    build:
      context: ./core-zig
      dockerfile_inline: |
        FROM ghcr.io/nicowillis/zig:0.13.0 AS builder
        WORKDIR /build
        COPY . .
        RUN zig build -Doptimize=ReleaseFast

        FROM python:3.12-slim
        WORKDIR /app
        COPY --from=builder /build/zig-out/lib/ .
        EXPOSE 8013
        CMD ["python3", "-m", "http.server", "8013", "--directory", "/app"]
    ports: [ "8013:8013" ]
    networks: [ polyglot ]

  # ── Wasm Finance (:8014) — nginx static server for finance.wasm ────────────
  # Serves the pre-compiled Zig WASM module with correct Content-Type so the
  # Svelte portal can fetch and instantiate it client-side without a round-trip
  # to any backend service.
  wasm-zig:
    image: nginx:1.27-alpine
    ports: [ "8014:80" ]
    volumes:
      - ./wasm-zig:/usr/share/nginx/html:ro
    configs:
      - source: wasm_nginx_conf
        target: /etc/nginx/conf.d/default.conf
    networks: [ polyglot ]

  # ── Svelte Portal (:5173) ───────────────────────────────────────────────────
  svelte-portal:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: [ "5173:5173" ]
    volumes:
      - ./portal-svelte:/app
      - svelte_node_modules:/app/node_modules
    depends_on:
      - go-hub
    networks: [ polyglot ]

  # ── Elm Order Terminal (:5174) ───────────────────────────────────────────────
  # Build stage: elm make compiles src/Main.elm to elm.js (--optimize, dead-code
  # eliminated).  Serve stage: nginx:1.27 serves elm.js + index.html as static
  # assets.  No Node.js runtime in the final image.
  terminal-elm:
    build:
      context: ./terminal-elm
      dockerfile: Dockerfile
    ports: [ "5174:80" ]
    networks: [ polyglot ]

configs:
  wasm_nginx_conf:
    content: |
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;

          location / {
              add_header Access-Control-Allow-Origin *;
              add_header Cache-Control "public, max-age=3600";
          }

          types {
              application/wasm  wasm;
              application/octet-stream  a o;
              text/plain  zig;
          }
      }

networks:
  polyglot:
    driver: bridge

volumes:
  postgres_data:
  fsharp_nuget:
  scala_coursier:
  dart_pub:
  elixir_mix:
  clojure_m2:
  svelte_node_modules:
