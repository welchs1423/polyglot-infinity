apiVersion: apps/v1
kind: Deployment
metadata:
  name: svelte-portal
  labels:
    app: svelte-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svelte-portal
  template:
    metadata:
      labels:
        app: svelte-portal
    spec:
      containers:
      - name: svelte-portal
        image: node:22-alpine
        ports:
        - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: svelte-portal
  labels:
    app: svelte-portal
spec:
  selector:
    app: svelte-portal
  ports:
  - name: port-5173
    port: 5173
    targetPort: 5173
    protocol: TCP
  type: ClusterIP
